---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vote-ingress
  labels:
    app: cloud-project
spec:
  rules:
  - http:
      paths:
      - path: /vote
        pathType: Prefix
        backend:
          service:
            name: vote
            port:
              number: 80
  - http:
      paths:
      - path: /result
        pathType: Prefix
        backend:
          service:
            name: result
            port:
              number: 8080