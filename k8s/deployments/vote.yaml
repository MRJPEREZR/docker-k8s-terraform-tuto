---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: cloud-project
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox
        command:
        - sh
        - -c
        - |
          until nc -z redis 6379; do
            echo "waiting for redis"
            sleep 2
          done
      containers:
      - name: vote
        image: europe-west3-docker.pkg.dev/cloud-login-489913/cloud-login/vote:latest
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20